<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Farbound</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Farbound</h1>
        <p id="output">Generating world...</p>

        <!-- Manual step entry -->
         <div>
            <label for="stepsInput">Steps Walked:</label>
            <input type="number" id="stepsInput" placeholder="e.g., 5000" />
            <button id="addStepsBtn">Add Steps</button>
         </div>
         <div id="map">
            <div id="path">
                <div id="progress"></div>
            </div>
                <div id="milestones"></div>
            </div>
         </div>
         <p>Total Distance: <span id="totalDistance">0</span> km</p>

         <script src="app.js"></script>

         <div id="arrivalOverlay" class="hidden">
            <div id="arrivalCard">
                <h2 id="arrivalTitle"></h2>
                <p id="arrivalText"></p>
                <button id="closeArrival">Continue</button>
            </div>
         </div>
    </body>
</html>
